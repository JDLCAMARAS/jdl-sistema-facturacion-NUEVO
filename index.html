<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Facturación JDL</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b}
header{background:#17365d;color:white;padding:20px;display:flex;align-items:center;justify-content:center;gap:20px}
.logo{width:110px;height:110px;object-fit:contain;border-radius:50%;background:white}
header h1{margin:0;font-size:25px}header p{color:#cbd5e1;margin-bottom:0}
main{max-width:1100px;margin:25px auto;padding:15px}
.panel{background:white;padding:22px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 10px #0000000b}
h2,h3{color:#17365d}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:7px}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:7px;margin-bottom:14px}
button{background:#17365d;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer;font-weight:bold}
button:hover{opacity:.9}.secundario{background:#64748b}.eliminar{background:#dc2626;padding:8px 12px}
.tabla{overflow-x:auto}table{width:100%;min-width:550px;border-collapse:collapse}
th,td{border-bottom:1px solid #e2e8f0;padding:12px;text-align:left}th{background:#f1f5f9}
.totales{max-width:350px;margin-left:auto;text-align:right;line-height:2}
.total{font-size:25px;font-weight:bold;color:#17365d}
#facturaPDF{display:none}
.logo-factura{width:130px;height:130px;object-fit:contain}
.factura-encabezado{display:flex;align-items:center;gap:20px;border-bottom:3px solid #17365d;padding-bottom:15px}
.factura-encabezado h1{color:#17365d}
.datos-factura{display:flex;justify-content:space-between;gap:20px;margin-top:25px}
.tabla-factura{width:100%;border-collapse:collapse;margin-top:25px}
.tabla-factura th{background:#17365d;color:white}
.tabla-factura th,.tabla-factura td{border:1px solid #cbd5e1;padding:10px}
.pie-factura{text-align:center;margin-top:50px;border-top:1px solid #cbd5e1;padding-top:15px;color:#17365d}
@media(max-width:600px){.grid{grid-template-columns:1fr}header{flex-direction:column;text-align:center}main{padding:10px}.panel{padding:15px}.datos-factura{flex-direction:column}}
@media print{body{background:white}header,.formulario{display:none!important}main{margin:0;padding:0;max-width:none}#facturaPDF{display:block!important;width:100%;padding:10px}@page{size:A4;margin:15mm}}
</style>
</head>
<body>
<header>
<img id="logoPrincipal" alt="Logo JDL" class="logo">
<div><h1>JDL - CÁMARAS Y MUCHOS MÁS</h1><p>Cámaras, mantenimiento y reparación de PC</p><p>Sistema de facturación y ventas</p></div>
</header>
<main>
<section class="panel formulario">
<h2>Datos del cliente</h2>
<div class="grid">
<div><label>Nombre del cliente</label><input id="cliente" placeholder="Nombre completo"></div>
<div><label>DUI / NIT</label><input id="duiNit" placeholder="Identificación"></div>
<div><label>Teléfono</label><input id="telefono" placeholder="Teléfono"></div>
<div><label>Correo electrónico</label><input id="correo" type="email" placeholder="Correo"></div>
</div>
<label>Dirección</label><input id="direccion" placeholder="Dirección del cliente">
</section>
<section class="panel formulario">
<h2>Productos y servicios</h2>
<div class="tabla"><table>
<thead><tr><th>Descripción</th><th>Cantidad</th><th>Precio ($)</th><th>Total</th><th>Eliminar</th></tr></thead>
<tbody id="productos"></tbody>
</table></div><br>
<button onclick="agregarProducto()">+ AGREGAR PRODUCTO</button>
</section>
<section class="panel formulario">
<h2>Configuración de factura</h2>
<label>Tratamiento del IVA</label>
<select id="ivaMode" onchange="calcular()">
<option value="adicional">Agregar IVA 13%</option><option value="incluido">IVA incluido</option><option value="sin_iva">Sin IVA</option>
</select>
<label>Forma de pago</label>
<select id="formaPago"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Pendiente</option></select>
<div class="totales">
<div>Subtotal: $<span id="subtotal">0.00</span></div>
<div>IVA: $<span id="iva">0.00</span></div>
<div class="total">TOTAL: $<span id="total">0.00</span></div>
</div><br>
<button onclick="generarFactura()">GENERAR FACTURA PDF</button>
<button class="secundario" onclick="limpiar()">NUEVA FACTURA</button>
</section>
<section id="facturaPDF"></section>
</main>

document.getElementById("logoPrincipal").src=LOGO_JDL;
const IVA=0.13;
let numeroFactura=Number(localStorage.getItem("jdl_numero")||0);

function agregarProducto(){
 const fila=document.createElement("tr");
 fila.innerHTML=`
 <td><input class="descripcion" placeholder="Producto o servicio"></td>
 <td><input class="cantidad" type="number" min="0.01" step="any" value="1"></td>
 <td><input class="precio" type="number" min="0" step="0.01" value="0"></td>
 <td class="importe">$0.00</td>
 <td><button class="eliminar" type="button">X</button></td>`;
 fila.querySelectorAll("input").forEach(i=>i.addEventListener("input",calcular));
 fila.querySelector(".eliminar").addEventListener("click",()=>{fila.remove();calcular()});
 document.getElementById("productos").appendChild(fila);calcular();
}
function obtenerTotales(){
 let base=0;
 document.querySelectorAll("#productos tr").forEach(f=>{
  const c=Number(f.querySelector(".cantidad").value),p=Number(f.querySelector(".precio").value);
  const importe=c*p;f.querySelector(".importe").textContent="$"+importe.toFixed(2);
  if(Number.isFinite(c)&&Number.isFinite(p)&&c>0&&p>=0)base+=importe;
 });
 const modo=document.getElementById("ivaMode").value;
 let subtotal=base,iva=0,total=base;
 if(modo==="adicional"){iva=base*IVA;total=base+iva}
 if(modo==="incluido"){iva=base-base/(1+IVA);subtotal=base-iva}
 return{subtotal,iva,total};
}
function calcular(){
 const t=obtenerTotales();
 document.getElementById("subtotal").textContent=t.subtotal.toFixed(2);
 document.getElementById("iva").textContent=t.iva.toFixed(2);
 document.getElementById("total").textContent=t.total.toFixed(2);
}
function escapar(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function generarFactura(){
 const cliente=document.getElementById("cliente").value.trim();
 const items=[...document.querySelectorAll("#productos tr")].map(f=>({
  descripcion:f.querySelector(".descripcion").value.trim(),
  cantidad:Number(f.querySelector(".cantidad").value),
  precio:Number(f.querySelector(".precio").value)
 })).filter(i=>i.descripcion);
 if(!cliente||!items.length){alert("Ingresa el cliente y al menos un producto.");return}
 if(items.some(i=>!Number.isFinite(i.cantidad)||i.cantidad<=0||!Number.isFinite(i.precio)||i.precio<0)){
  alert("Revisa las cantidades y los precios.");return;
 }
 const t=obtenerTotales();numeroFactura++;
 localStorage.setItem("jdl_numero",numeroFactura);
 const numero="JDL-"+String(numeroFactura).padStart(5,"0");
 const fecha=new Date().toLocaleDateString("es-SV");
 const detalle=items.map(i=>`<tr><td>${escapar(i.descripcion)}</td><td>${i.cantidad}</td><td>$${i.precio.toFixed(2)}</td><td>$${(i.cantidad*i.precio).toFixed(2)}</td></tr>`).join("");
 const factura=document.getElementById("facturaPDF");
 factura.innerHTML=`
 <div class="factura-encabezado">
 <img src="${LOGO_JDL}" class="logo-factura" alt="Logo JDL">
 <div><h1>JDL - CÁMARAS Y MUCHOS MÁS</h1><p>CÁMARAS, MANTENIMIENTO Y REPARACIÓN DE PC</p><h2>FACTURA / COMPROBANTE</h2></div>
 </div>
 <div class="datos-factura">
 <div><h3>DATOS DEL CLIENTE</h3>
 <p><b>Cliente:</b> ${escapar(cliente)}</p>
 <p><b>DUI / NIT:</b> ${escapar(document.getElementById("duiNit").value)}</p>
 <p><b>Teléfono:</b> ${escapar(document.getElementById("telefono").value)}</p>
 <p><b>Correo:</b> ${escapar(document.getElementById("correo").value)}</p>
 <p><b>Dirección:</b> ${escapar(document.getElementById("direccion").value)}</p></div>
 <div><h3>DATOS DE FACTURA</h3><p><b>Número:</b> ${numero}</p><p><b>Fecha:</b> ${fecha}</p></div>
 </div>
 <table class="tabla-factura"><thead><tr><th>DESCRIPCIÓN</th><th>CANTIDAD</th><th>PRECIO</th><th>TOTAL</th></tr></thead><tbody>${detalle}</tbody></table>
 <div class="totales"><p>Subtotal: $${t.subtotal.toFixed(2)}</p><p>IVA: $${t.iva.toFixed(2)}</p><h2 class="total">TOTAL: $${t.total.toFixed(2)}</h2></div>
 <p><b>Forma de pago:</b> ${escapar(document.getElementById("formaPago").value)}</p>
 <div class="pie-factura"><h3>¡GRACIAS POR CONFIAR EN JDL!</h3><p>SEGURIDAD, CALIDAD Y CONFIANZA.</p><p>CÁMARAS, MANTENIMIENTO Y REPARACIÓN DE PC</p></div>`;
 window.print();
}
function limpiar(){
 if(!confirm("¿Deseas iniciar una nueva factura?"))return;
 ["cliente","duiNit","telefono","correo","direccion"].forEach(id=>document.getElementById(id).value="");
 document.getElementById("productos").innerHTML="";
 document.getElementById("ivaMode").value="adicional";
 document.getElementById("formaPago").value="Efectivo";
 document.getElementById("facturaPDF").innerHTML="";
 agregarProducto();
}
agregarProducto();
</script>
</body>
</html>
